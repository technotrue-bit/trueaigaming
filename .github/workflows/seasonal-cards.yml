# Keeps Aurora's World's game card in season. The game dresses up by the calendar (Halloween all October, cozy
# autumn all November, and back to sunny the rest of the year), and its ?poster page shows that day's look with
# the logo and no buttons. On the 1st of every month this retakes the card from it, the same way
# scripts/thumb.mjs always has, and commits the new picture, which deploys the site.
# Run it by hand from the Actions tab (Run workflow) after the game gets a new season or event.
name: Seasonal game cards

on:
  schedule:
    - cron: "17 12 1 * *" # the 1st of each month, 12:17 UTC (early morning in the US)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seasonal-cards
  cancel-in-progress: false

jobs:
  aurora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Retake the card from the game's poster
        run: node scripts/thumb.mjs "https://squishy-closet.vercel.app/?poster" public/thumbs/squishy-closet.png
      - name: Make the WebP copy
        run: |
          sudo apt-get install -y --no-install-recommends webp
          cwebp -quiet -q 80 public/thumbs/squishy-closet.png -o public/thumbs/squishy-closet.webp
      - name: Commit the new card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/thumbs/squishy-closet.png public/thumbs/squishy-closet.webp
          if git diff --cached --quiet; then echo "Card unchanged"; exit 0; fi
          git commit -m "Aurora's World: this month's card"
          git push
