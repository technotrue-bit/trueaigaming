<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0221" />
    <title>TrueAIGaming: games built with AI</title>
    <meta name="description" content="TrueAIGaming: a free arcade of games built with AI. Pick one and play instantly in your browser." />
    <link rel="canonical" href="https://trueaigaming.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrueAIGaming" />
    <meta property="og:title" content="TrueAIGaming: games built with AI" />
    <meta property="og:description" content="A free arcade of games built with AI. Pick one and play instantly in your browser." />
    <meta property="og:url" content="https://trueaigaming.com/" />
    <meta property="og:image" content="https://trueaigaming.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TrueAIGaming: Real games. Built with AI. Free to play, right now." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ItsMeTrueG" />
    <meta name="twitter:title" content="TrueAIGaming: games built with AI" />
    <meta name="twitter:description" content="A free arcade of games built with AI. Pick one and play instantly in your browser." />
    <meta name="twitter:image" content="https://trueaigaming.com/og.png" />
    <meta name="twitter:image:alt" content="TrueAIGaming: Real games. Built with AI. Free to play, right now." />
    <!-- Google Search Console: paste the verification tag here when Joey has the token, e.g. <meta name="google-site-verification" content="TOKEN" />. Not needed if verified via DNS TXT. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <a class="skip" href="#games">Skip to games</a>
    <header class="hero">
      <h1 class="logo" aria-label="TrueAIGaming"><span class="logo-true">True</span><span class="logo-ai">AI</span><span class="logo-gaming">Gaming</span></h1>
      <p class="tagline">Real games. Built with AI. Free to play, right now.</p>
    </header>
    <main id="games" class="wrap">
      <div class="section-head">
        <h2>Insert coin</h2>
        <p id="count" class="muted" aria-live="polite"></p>
      </div>
      <!-- Cards are prerendered here from public/games.json at build time (vite.config.ts), then refreshed by src/home.ts. -->
      <ul id="grid" class="grid" aria-busy="true"></ul>
    </main>
    <footer class="footer wrap">
      <p>No accounts. Just games.</p>
      <p class="tip">Tips keep the games free. <a class="btn btn-tip" href="https://ko-fi.com/X3K0291W5Z" target="_blank" rel="noopener">Support on Ko-fi</a></p>
    </footer>
    <button id="feedback" class="feedback-fab" type="button" aria-label="Report a bug or add suggestions"><span aria-hidden="true">⚙️</span></button>
    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
